services:
  # PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: opensource_pulse_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: opensource_pulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - docker_data_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opensource_pulse

  # Redis
  redis:
    image: redis:7-alpine
    container_name: opensource_pulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - docker_data_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opensource_pulse

  # API Backend (Live-Reload via Air + Volume Mount)
  api:
    build:
      context: ../apps/api
      dockerfile: ../../docker/Dockerfile.api
    container_name: opensource_pulse_api
    restart: unless-stopped
    ports:
      - "9001:9001"
    env_file:
      - development/.env.api
    environment:
      # Production mode: quiet Gin + silence per-query SQL logging.
      - GIN_MODE=release
    volumes:
      - ../apps/api:/app
      - api_tmp:/app/tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opensource_pulse

  # Frontend (PRODUCTION: prebuilt TanStack Start bundle served by
  # `vite preview` behind the nginx edge below. VITE_API_URL is baked at
  # build time — rebuild to change the API host. Not exposed publicly;
  # traffic enters through `web-edge`.)
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:9001/api}
    container_name: opensource_pulse_web
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - opensource_pulse

  # Nginx edge: gzip + cache policy + security headers in front of `web`.
  # This is what the deploy health check and browsers hit on ${WEB_PORT:-3001}.
  web-edge:
    image: nginx:1.27-alpine
    container_name: opensource_pulse_web_edge
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3001}:80"
    volumes:
      - ./nginx.web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - opensource_pulse

networks:
  opensource_pulse:
    driver: bridge

volumes:
  docker_data_postgres:
  docker_data_redis:
  api_tmp: