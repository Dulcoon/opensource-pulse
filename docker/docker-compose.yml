
services:
  # PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: opensource_pulse_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: opensource_pulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - docker_data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: opensource_pulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - docker_data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend
  api:
    build:
      context: ../api
      dockerfile: ../Dockerfile.api
    container_name: opensource_pulse_api
    restart: unless-stopped
    ports:
      - "9001:9001"
    env_file:
      - docker/development/.env.api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opensource_pulse

  # Frontend
  web:
    build:
      context: ../web
      dockerfile: ../Dockerfile.web
    container_name: opensource_pulse_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - docker/development/.env.web
    depends_on:
      api:
        condition: service_healthy
    networks:
      - opensource_pulse

networks:
  opensource_pulse:
    driver: bridge

volumes:
  docker_data: