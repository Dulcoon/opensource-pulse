# Edge reverse proxy in front of the TanStack Start production server.
# The node server (service `web`) renders SSR HTML and serves /assets/*;
# nginx adds what it cannot: gzip, cache policy, security headers.
#
# - /assets/* are content-hashed by Vite → immutable, cache 1 year.
# - HTML shell + app routes → never cached (deploys take effect at once).
# - Static files (favicons, logos, fonts) → short cache.

upstream web_app {
  server web:3000;
  keepalive 32;
}

# gzip on-the-fly for text assets.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/json
  application/xml
  image/svg+xml
  font/ttf
  font/otf
  application/font-woff
  application/font-woff2;

server {
  listen 80;
  server_name _;

  # Don't leak dotfiles.
  location ~ /\. {
    deny all;
  }

  # Hashed build assets — filename changes on every build, safe to cache forever.
  # Single explicit Cache-Control (no `expires`, to avoid duplicate headers).
  location /assets/ {
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    proxy_pass http://web_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
  }

  # Favicons / logos / fonts — short cache.
  location ~* \.(?:ico|png|webp|svg|woff|woff2|ttf)$ {
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "public, max-age=604800" always;
    proxy_pass http://web_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
  }

  # HTML shell + SPA/SSR routes — never cached.
  location / {
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_pass http://web_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
